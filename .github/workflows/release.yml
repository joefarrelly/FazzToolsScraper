name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Get version
        id: version
        run: echo "tag=$(date -u +%Y.%m.%d.%H%M)" >> $GITHUB_OUTPUT

      - name: Package addon
        run: |
          mkdir -p FazzToolsScraper
          cp core.lua FazzToolsScraper/
          cp FazzToolsScraper.toc FazzToolsScraper/
          zip -r FazzToolsScraper-${{ steps.version.outputs.tag }}.zip FazzToolsScraper/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            FazzToolsScraper-${{ steps.version.outputs.tag }}.zip \
            --title "FazzToolsScraper ${{ steps.version.outputs.tag }}" \
            --notes "Automated release from dev→main merge."
