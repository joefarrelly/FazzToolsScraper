name: Lint

on:
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install luacheck
        run: |
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck

      - name: Luacheck
        run: |
          luacheck core.lua \
            --globals \
              CreateFrame GetSpecializationInfo GetSpecialization \
              GetNumBindings GetBinding GetBindingKey \
              GetActionInfo GetActionTexture \
              GetMacroInfo GetItemInfo \
              GetSpellTabInfo GetSpellBookItemName IsPassiveSpell \
              GetSpellDescription GetSpellTexture \
              GetTalentInfo IsSpellKnown \
              UnitName GetRealmName GetAddOnInfo \
              GetMoney C_CurrencyInfo GetNumSavedInstances GetSavedInstanceInfo \
              C_MythicPlus C_WeeklyRewards Enum RequestTimePlayed \
              SlashCmdList SLASH_FAZZTOOLSSCRAPER1 \
              BOOKTYPE_SPELL FazzToolsScraperDB
